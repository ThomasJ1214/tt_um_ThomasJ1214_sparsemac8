# Tiny Tapeout project information
project:
  title:        "Sparse 8x8 MAC with ReLU"   # Project title
  author:       "Thomas Jenkins"             # Your name
  discord:      ""                           # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Signed 8x8 multiply-accumulate unit that skips zero operands and counts them, with a fused ReLU and saturating requantise output"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000  # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_ThomasJ1214_sparsemac8"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_ThomasJ1214_sparsemac8.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA0 - operand data bus, bit 0 (LSB)"
  ui[1]: "DATA1 - operand data bus, bit 1"
  ui[2]: "DATA2 - operand data bus, bit 2"
  ui[3]: "DATA3 - operand data bus, bit 3"
  ui[4]: "DATA4 - operand data bus, bit 4"
  ui[5]: "DATA5 - operand data bus, bit 5"
  ui[6]: "DATA6 - operand data bus, bit 6"
  ui[7]: "DATA7 - operand data bus, bit 7 (sign bit, two's complement)"

  # Outputs
  uo[0]: "OUT0 - selected result byte, bit 0 (LSB)"
  uo[1]: "OUT1 - selected result byte, bit 1"
  uo[2]: "OUT2 - selected result byte, bit 2"
  uo[3]: "OUT3 - selected result byte, bit 3"
  uo[4]: "OUT4 - selected result byte, bit 4"
  uo[5]: "OUT5 - selected result byte, bit 5"
  uo[6]: "OUT6 - selected result byte, bit 6"
  uo[7]: "OUT7 - selected result byte, bit 7 (MSB)"

  # Bidirectional pins
  uio[0]: "OP0 - opcode bit 0 (input only)"
  uio[1]: "OP1 - opcode bit 1 (input only)"
  uio[2]: "OP2 - opcode bit 2 (input only)"
  uio[3]: "SEL0 - result byte select, bit 0 (input only)"
  uio[4]: "SEL1 - result byte select, bit 1 (input only)"
  uio[5]: "RELU_EN - clamp a negative result to zero (input only)"
  uio[6]: "SAT_EN - saturate the byte instead of truncating it (input only)"
  uio[7]: "STAT_SEL - read the skipped-MAC counter instead of the total (input only)"

# Do not change!
yaml_version: 6
